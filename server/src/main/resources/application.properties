spring.application.name=basalt-server
spring.datasource.url=jdbc:h2:file:./basalt
spring.datasource.username=basalt
spring.datasource.password=basalt

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.check_nullability=true

spring.jpa.open-in-view=false

server.port=7600
server.ssl.key-store=file:./basalt.p12
server.ssl.key-store-password=basalt
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=basalt