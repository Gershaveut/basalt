name: Java Packeger

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Download appimagetool
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p /home/runner/work/basalt/basalt/app/build/assets/ 
          mv appimagetool /home/runner/work/basalt/basalt/app/build/assets/

      - name: Run Java Packager
        run: ./gradlew package

      - name: Upload Windows EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basalt.exe
          path: app/build/*.exe
          overwrite: true
          retention-days: 7
          if-no-files-found: error

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basalt.dmg
          path: app/build/*.dmg
          overwrite: true
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basalt.AppImage
          path: app/build/*.AppImage
          overwrite: true
          retention-days: 7
          if-no-files-found: error
