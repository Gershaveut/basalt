subprojects {
    apply plugin: 'java'
    apply plugin: 'application'

    group = 'dev.code_offline'
    version = '0.2'

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.7'
        implementation 'org.springframework.boot:spring-boot-starter-data-rest:3.5.6'
        implementation 'org.springframework.boot:spring-boot-starter-websocket:3.5.6'
        implementation 'org.springframework.boot:spring-boot-starter-security:3.5.7'
        implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.7'
        runtimeOnly 'com.h2database:h2'
    }
}
